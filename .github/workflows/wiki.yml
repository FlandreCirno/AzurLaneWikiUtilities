name: Wiki Utilities

on:
  schedule:
  - cron: '45 * * * *'

  push:
    branches:
      - master

  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Update JSON data submodule
      run: |
        git submodule update --remote --init --recursive

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    # AzurLaneData (JSON) stopped receiving updates in May 2026, so the Lua
    # configuration it is generated from is fetched directly. The upstream is
    # 2.7 GB; a blobless sparse clone pulls only the ~130 MB per region that
    # the generators actually read.
    - name: Fetch Lua configuration
      run: |
        python scripts/fetch_lua_data.py

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .

    - name: Check data sources
      run: |
        python scripts/check_data_sources.py

    - name: Clean output directory
      run: |
        python scripts/clean_output.py

    - name: Generate all wiki content
      run: |
        python scripts/generate_all.py

    - name: Get commit summary
      run: |
        output=$(python scripts/get_summary.py)
        echo "summary=$output" >> $GITHUB_OUTPUT
      id: summary

    - name: Commit and Push
      uses: EndBug/add-and-commit@v9
      with:
        message: ${{ steps.summary.outputs.summary }}
        add: 'Wiki/*'
